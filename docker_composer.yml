version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: event_manager_db
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: event_manager_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: